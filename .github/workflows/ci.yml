name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER == '1' && (vars.CI_RUNNER_LABEL_LIGHT || 'local-docker-light') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Run ops-console test suite
        run: python3 scripts/ci/run-tests.py --report test-report.json
      - name: Check test legs
        if: always()
        run: git ls-files -- 'tests/test_*.py' | python3 scripts/ci/check-test-legs.py test-report.json
      - name: Run repository smoke tests
        run: python3 -m unittest discover -s tests -v

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan the tree and the history
        env:
          SCAN_DENY: ${{ secrets.SCAN_DENY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$SCAN_DENY" ]; then
            printf '%s\n' "$SCAN_DENY" > "$RUNNER_TEMP/deny.txt"
            export SCAN_DENY_FILE="$RUNNER_TEMP/deny.txt"
          fi
          python3 scripts/scan.py --tree .
          base="$BASE_SHA"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "${base}^{commit}" >/dev/null 2>&1; then
            python3 scripts/scan.py --history --range "$base..HEAD"
          else
            python3 scripts/scan.py --history
          fi
